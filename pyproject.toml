[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offreader"
version = "0.1.0"
description = "Extrait les planches d'un lecteur web, dans l'ordre, vers un dossier ou une archive CBZ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright>=1.45", "httpx>=0.27", "pillow>=10.4"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
offreader = "offreader.cli:main"
offreader-web = "offreader.web:main"

[project.gui-scripts]
offreader-gui = "offreader.gui:main"

[tool.setuptools]
packages = ["offreader", "offreader.strategies", "offreader.adapters"]

[tool.setuptools.package-data]
offreader = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
