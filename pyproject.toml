[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offreader"
version = "0.1.0"
description = "Extrait les planches d'un lecteur web, dans l'ordre, vers un dossier ou une archive CBZ."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright>=1.45", "httpx>=0.27", "pillow>=10.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
offreader = "offreader.cli:main"

[tool.setuptools]
packages = ["offreader", "offreader.strategies", "offreader.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
