<!doctype html>
<html><head><meta charset="utf-8"><title>Lecteur liste</title>
<style>body{margin:0} #pg{width:500px;height:720px;display:block}</style></head>
<body>
<select id="chapters"><option>Chapitre 1</option><option selected>Chapitre 2</option></select>
<select id="pages"><option>1</option><option>2</option><option>3</option><option>4</option></select>
<div class="reader"><img id="pg" src="/img/b0d5.jpg"></div>
<script>
  const pages = ['b0d5.jpg', 'zz03.jpg', 'k7f2.jpg', 'm4q8.jpg'];
  document.getElementById('pages').addEventListener('change', (e) => {
    document.getElementById('pg').src = '/img/' + pages[e.target.selectedIndex];
  });
</script>
</body></html>
